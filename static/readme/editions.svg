<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StarRadar 两个版本 · 两种机制</title>
  <desc id="desc">左：公版同一份客观榜单，信号点指向同一个雷达盘，千人同榜；右：个人版画像标签环绕专属雷达，千人千面。两套完全不同的排序与解读机制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#071529"/><stop offset="0.52" stop-color="#0E2746"/><stop offset="1" stop-color="#07101F"/></linearGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFD166"/><stop offset="1" stop-color="#FF9F2D"/></linearGradient>
    <linearGradient id="arcG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7DB5FF"/><stop offset="1" stop-color="#2471EE"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A9C9F8" stroke-opacity="0.07"/></pattern>
  </defs>
  <rect width="1200" height="480" rx="26" fill="url(#bg)"/><rect width="1200" height="480" rx="26" fill="url(#grid)"/>
  <circle cx="1040" cy="30" r="230" fill="#2471EE" fill-opacity="0.10"/><circle cx="120" cy="480" r="220" fill="#FF9F2D" fill-opacity="0.05"/>

  <text x="56" y="50" fill="#8FB9F7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3">STARRADAR · 两个版本</text>
  <text x="600" y="94" text-anchor="middle" fill="#DCEBFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="32" font-weight="800">两个版本 · 两种机制</text>
  <text x="600" y="128" text-anchor="middle" fill="#8FB9F7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="18">同一个产品，两套完全不同的排序与解读机制</text>

  <!-- ══════ 左：公版 ══════ -->
  <g>
    <!-- 雷达盘：中心 330,285 半径 112 -->
    <circle cx="330" cy="285" r="140" fill="none" stroke="#B8D6FF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="330" cy="285" r="112" fill="#ffffff" fill-opacity="0.04" stroke="#B8D6FF" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="330" cy="285" r="84" fill="none" stroke="#B8D6FF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="330" cy="285" r="56" fill="none" stroke="#B8D6FF" stroke-opacity="0.16" stroke-width="2"/>
    <!-- 扫描弧：圆心 330,285 半径 112，从 220° 顺时针扫过顶部到 320°（对称弧） -->
    <path d="M 244.2,216.0 A 112 112 0 0 1 415.8,216.0" fill="none" stroke="url(#arcG)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="330" cy="285" r="10" fill="url(#starG)"/>
    <!-- 同榜信号点：半径 126 圆周上 60° 均匀分布（对称），全部指向同一中心 -->
    <g fill="#5EA2FF">
      <circle cx="426.5" cy="204.0" r="9"/><circle cx="308.1" cy="160.9" r="9"/><circle cx="211.6" cy="241.9" r="9"/>
      <circle cx="233.5" cy="366.0" r="9"/><circle cx="351.9" cy="409.1" r="9"/><circle cx="448.4" cy="328.1" r="9"/>
    </g>
    <g stroke="#4F98FF" stroke-opacity="0.55" stroke-width="2.5">
      <line x1="330" y1="285" x2="426.5" y2="204.0"/><line x1="330" y1="285" x2="308.1" y2="160.9"/>
      <line x1="330" y1="285" x2="211.6" y2="241.9"/><line x1="330" y1="285" x2="233.5" y2="366.0"/>
      <line x1="330" y1="285" x2="351.9" y2="409.1"/><line x1="330" y1="285" x2="448.4" y2="328.1"/>
    </g>
  </g>
  <text x="330" y="440" text-anchor="middle" fill="#DCEBFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="26" font-weight="700">公版</text>
  <text x="330" y="460" text-anchor="middle" fill="#8FB9F7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="18">同一份客观榜单 · 千人同榜</text>

  <!-- ══════ 右：个人版 ══════ -->
  <g>
    <!-- 个性化雷达：中心 870,285 半径 112 -->
    <circle cx="870" cy="285" r="140" fill="none" stroke="#B8D6FF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="870" cy="285" r="112" fill="#ffffff" fill-opacity="0.04" stroke="#B8D6FF" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="870" cy="285" r="84" fill="none" stroke="#B8D6FF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="870" cy="285" r="56" fill="none" stroke="#B8D6FF" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M 784.2,216.0 A 112 112 0 0 1 955.8,216.0" fill="none" stroke="url(#arcG)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="870" cy="285" r="10" fill="url(#starG)"/>
    <!-- 画像标签 chips：轨道半径 167（与盘相切），45° 四角对称 -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="14" font-weight="600">
      <g transform="translate(988.1,166.9)"><rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1D63D5" fill-opacity="0.32" stroke="#5EA2FF" stroke-opacity="0.7"/><text x="0" y="6" text-anchor="middle" fill="#DCEBFF">AI 智能体</text></g>
      <g transform="translate(988.1,403.1)"><rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1D63D5" fill-opacity="0.32" stroke="#5EA2FF" stroke-opacity="0.7"/><text x="0" y="6" text-anchor="middle" fill="#DCEBFF">MCP 服务器</text></g>
      <g transform="translate(751.9,166.9)"><rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1D63D5" fill-opacity="0.32" stroke="#5EA2FF" stroke-opacity="0.7"/><text x="0" y="6" text-anchor="middle" fill="#DCEBFF">Python 生态</text></g>
      <g transform="translate(751.9,403.1)"><rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1D63D5" fill-opacity="0.32" stroke="#5EA2FF" stroke-opacity="0.7"/><text x="0" y="6" text-anchor="middle" fill="#DCEBFF">Deep Research</text></g>
    </g>
  </g>
  <text x="870" y="440" text-anchor="middle" fill="#DCEBFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="26" font-weight="700">个人版</text>
  <text x="870" y="460" text-anchor="middle" fill="#8FB9F7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="18">画像驱动的专属雷达 · 千人千面</text>

  <!-- VS 徽标：严格居中于两盘之间 600,285 -->
  <g transform="translate(600,285)">
    <circle r="30" fill="#ffffff"/>
    <text y="9" text-anchor="middle" fill="#1677ff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="22" font-weight="800">VS</text>
  </g>
</svg>
