<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" role="img" aria-labelledby="t d">
  <title id="t">StarRadar 两个版本 · 两种机制</title>
  <desc id="d">公版：同一份客观榜单，千人同榜；个人版：画像驱动的专属雷达，千人千面</desc>
  <defs>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF9F2D"/>
    </linearGradient>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
  </defs>

  <!-- 背景容器 -->
  <rect x="12" y="12" width="1176" height="406" rx="28" fill="url(#bgG)"/>
  <rect x="12" y="12" width="1176" height="406" rx="28" fill="none" stroke="#d6e6fb" stroke-width="2"/>

  <!-- 标题 -->
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#122033">两个版本 · 两种机制</text>
  <text x="600" y="98" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6b7a90">同一个产品，两套完全不同的排序与解读机制</text>

  <!-- ══════ 左：公版 ══════ -->
  <g transform="translate(120, 96)">
    <!-- 雷达盘 -->
    <circle cx="170" cy="150" r="128" fill="#ffffff" stroke="#dceaf7" stroke-width="2"/>
    <circle cx="170" cy="150" r="96" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <circle cx="170" cy="150" r="64" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <!-- 扫描弧 -->
    <path d="M 262,94 A 128 128 0 1 0 262,206" fill="none" stroke="#1677ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="170" cy="150" r="10" fill="url(#starG)"/>
    <!-- 同榜信号点：多个点指向同一中心 -->
    <g fill="#1677ff">
      <circle cx="110" cy="70" r="9"/><circle cx="290" cy="70" r="9"/>
      <circle cx="60" cy="150" r="9"/><circle cx="280" cy="150" r="9"/>
      <circle cx="110" cy="230" r="9"/><circle cx="290" cy="230" r="9"/>
    </g>
    <g stroke="#9ec4f7" stroke-width="3" opacity="0.7">
      <line x1="170" y1="150" x2="110" y2="70"/><line x1="170" y1="150" x2="290" y2="70"/>
      <line x1="170" y1="150" x2="60" y2="150"/><line x1="170" y1="150" x2="280" y2="150"/>
      <line x1="170" y1="150" x2="110" y2="230"/><line x1="170" y1="150" x2="290" y2="230"/>
    </g>
  </g>
  <text x="290" y="238" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#122033">公版</text>
  <text x="290" y="268" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">同一份客观榜单</text>
  <text x="290" y="292" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">千人同榜 · 打开即用</text>

  <!-- ══════ 右：个人版 ══════ -->
  <g transform="translate(640, 96)">
    <!-- 个性化雷达 -->
    <circle cx="170" cy="150" r="128" fill="#ffffff" stroke="#dceaf7" stroke-width="2"/>
    <circle cx="170" cy="150" r="96" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <circle cx="170" cy="150" r="64" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <path d="M 262,94 A 128 128 0 1 0 262,206" fill="none" stroke="#1677ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="170" cy="150" r="10" fill="url(#starG)"/>
    <!-- 画像标签 chips 环绕（千人千面） -->
    <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">
      <g transform="translate(170,60)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">AI 智能体</text></g>
      <g transform="translate(305,120)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">MCP 服务器</text></g>
      <g transform="translate(305,210)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">Python 生态</text></g>
      <g transform="translate(170,275)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">Deep Research</text></g>
      <g transform="translate(35,210)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">向量数据库</text></g>
      <g transform="translate(35,120)"><rect x="-52" y="-16" width="104" height="32" rx="16" fill="#e8f1ff"/><text x="0" y="6" text-anchor="middle" fill="#1677ff">Agent Skills</text></g>
    </g>
  </g>
  <text x="810" y="238" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#122033">个人版</text>
  <text x="810" y="268" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">画像驱动的专属雷达</text>
  <text x="810" y="292" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">千人千面 · 只为你</text>

  <!-- 中间 VS -->
  <g transform="translate(600,318)">
    <circle r="26" fill="#ffffff" stroke="#d6e6fb" stroke-width="2"/>
    <text y="9" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1677ff">VS</text>
  </g>

  <!-- 底部提示 -->
  <text x="600" y="400" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#9badc2">公版回答「这周哪些项目在起飞」 · 个人版回答「哪些项目适合我」</text>
</svg>
