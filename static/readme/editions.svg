<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-labelledby="t d">
  <title id="t">StarRadar 两个版本 · 两种机制</title>
  <desc id="d">公版：同一份客观榜单，千人同榜；个人版：画像驱动的专属雷达，千人千面</desc>
  <defs>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF9F2D"/>
    </linearGradient>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
  </defs>

  <!-- 背景容器 -->
  <rect x="12" y="12" width="1176" height="456" rx="28" fill="url(#bgG)"/>
  <rect x="12" y="12" width="1176" height="456" rx="28" fill="none" stroke="#d6e6fb" stroke-width="2"/>

  <!-- 标题 -->
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#122033">两个版本 · 两种机制</text>
  <text x="600" y="94" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6b7a90">同一个产品，两套完全不同的排序与解读机制</text>

  <!-- ══════ 左：公版（组原点 120,110；圆圆心 290,260 r110） ══════ -->
  <g transform="translate(120, 110)">
    <circle cx="170" cy="150" r="110" fill="#ffffff" stroke="#dceaf7" stroke-width="2"/>
    <circle cx="170" cy="150" r="78" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <circle cx="170" cy="150" r="46" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <!-- 扫描弧：圆心 (170,150) r110，缺口右上 -->
    <path d="M 280,150 A 110 110 0 1 1 274,177" fill="none" stroke="#1677ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="170" cy="150" r="10" fill="url(#starG)"/>
    <!-- 信号点 r90 六点对称（0/60/120/180/240/300°） -->
    <g fill="#1677ff">
      <circle cx="260" cy="150" r="9"/>
      <circle cx="215" cy="72" r="9"/>
      <circle cx="125" cy="72" r="9"/>
      <circle cx="80" cy="150" r="9"/>
      <circle cx="125" cy="228" r="9"/>
      <circle cx="215" cy="228" r="9"/>
    </g>
    <g stroke="#9ec4f7" stroke-width="3" opacity="0.7">
      <line x1="170" y1="150" x2="260" y2="150"/>
      <line x1="170" y1="150" x2="215" y2="72"/>
      <line x1="170" y1="150" x2="125" y2="72"/>
      <line x1="170" y1="150" x2="80" y2="150"/>
      <line x1="170" y1="150" x2="125" y2="228"/>
      <line x1="170" y1="150" x2="215" y2="228"/>
    </g>
  </g>
  <text x="290" y="402" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#122033">公版</text>
  <text x="290" y="428" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">千人同榜 · 打开即用</text>

  <!-- ══════ 右：个人版（组原点 640,110；圆圆心 810,260 r110） ══════ -->
  <g transform="translate(640, 110)">
    <circle cx="170" cy="150" r="110" fill="#ffffff" stroke="#dceaf7" stroke-width="2"/>
    <circle cx="170" cy="150" r="78" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <circle cx="170" cy="150" r="46" fill="none" stroke="#e8f0fb" stroke-width="2"/>
    <path d="M 280,150 A 110 110 0 1 1 274,177" fill="none" stroke="#1677ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="170" cy="150" r="10" fill="url(#starG)"/>
    <!-- 画像标签 chips r150 四方（上/下/左/右），与圆 r110 保持 40px 间隙 -->
    <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">
      <g transform="translate(170,0)"><rect x="-44" y="-15" width="88" height="30" rx="15" fill="#e8f1ff"/><text x="0" y="5" text-anchor="middle" fill="#1677ff">AI 智能体</text></g>
      <g transform="translate(170,300)"><rect x="-44" y="-15" width="88" height="30" rx="15" fill="#e8f1ff"/><text x="0" y="5" text-anchor="middle" fill="#1677ff">Deep Research</text></g>
      <g transform="translate(14,150)"><rect x="-44" y="-15" width="88" height="30" rx="15" fill="#e8f1ff"/><text x="0" y="5" text-anchor="middle" fill="#1677ff">MCP 服务器</text></g>
      <g transform="translate(326,150)"><rect x="-44" y="-15" width="88" height="30" rx="15" fill="#e8f1ff"/><text x="0" y="5" text-anchor="middle" fill="#1677ff">向量数据库</text></g>
    </g>
  </g>
  <text x="810" y="440" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#122033">个人版</text>
  <text x="810" y="466" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6b7a90">千人千面 · 只为你</text>

  <!-- 中间 VS：两雷达几何中点 (550,260) -->
  <g transform="translate(550,260)">
    <circle r="26" fill="#ffffff" stroke="#d6e6fb" stroke-width="2"/>
    <text y="9" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1677ff">VS</text>
  </g>
</svg>
